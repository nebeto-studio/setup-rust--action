name: Develop

on:
  workflow_dispatch:
  push:
    branches:
      - feat/**
      - fix/**
      - docs/**
      - ci/**
      - chore/**
      - test/**
      - perf/**
      - refactor/**
      - revert/**
      - style/**

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: develop-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    name: Create a Pull Request
    steps:
      - id: checkout-code
        name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: create-or-get-existing-draft-pull-request
        name: Create or get an existing draft Pull Request on Github
        uses: nebetoxyz/create-pull-request--action@1ca7ea7e2434e6df3b3eec192a2ccaa3512b2376 # v1.14.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          assignees: ${{ github.actor }}
  check-testing:
    runs-on: ubuntu-latest
    name: Check Testing
    needs: create-pull-request
    strategy:
      matrix:
        cache: ["", "cargo"]
        components: ["", "rustfmt,rust-docs,rust-analyzer,clippy,llvm-tools"]
    steps:
      - id: checkout-code
        name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
      - id: setup-rust
        name: Setup Rust
        uses: ./
        with:
          cache: ${{ matrix.cache }}
          components: ${{ matrix.components }}
      - id: test
        name: Test
        run: |
          rustc --version
          cargo --version
